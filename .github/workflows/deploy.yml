name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Vite injects VITE_*-prefixed env vars into the bundle at build
          # time via __PHOENIX_ENV__ (see vite.config.ts → loadMergedViteEnv).
          # GitHub Actions doesn't auto-expose secrets to step env; we have
          # to map them explicitly here.
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
          VITE_PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}

      # rsync, not scp: the scp action unpacks an archive by running shell
      # commands on the server, so the deploy key needs a full shell there.
      # rsync needs none, which lets the server restrict this key to uploads
      # only. --delete also makes the webroot an exact mirror of dist/, so
      # old content-hashed bundles no longer pile up.
      #
      # .well-known is excluded on purpose: it can hold hand-placed files
      # (ACME challenges, nostr.json) that are not part of any build.
      - name: Deploy to production server
        uses: burnett01/rsync-deployments@v9
        with:
          # No -p, plus --omit-dir-times: leave the webroot's own mode and
          # times alone, so a webroot the deploy user doesn't own can't turn
          # a complete transfer into exit 23.
          switches: -rlt --omit-dir-times --delete --exclude='.well-known/'
          path: dist/
          remote_path: ${{ secrets.PROD_PATH }}
          remote_host: ${{ secrets.PROD_HOST }}
          remote_port: ${{ secrets.PROD_PORT }}
          remote_user: ${{ secrets.PROD_USER }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}
